[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/sched",
    "crates/core",
    "crates/node",
    "tests/harness",
    "tests/sim",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/donkomura/PgSteward"

[workspace.dependencies]
pgsteward-protocol = { path = "crates/protocol", version = "0.1.0" }
pgsteward-sched = { path = "crates/sched", version = "0.1.0" }
pgsteward-core = { path = "crates/core", version = "0.1.0" }
pgsteward-harness = { path = "tests/harness", version = "0.1.0" }

anyhow = "1.0"
base64 = "0.23"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
fallible-iterator = "0.2"
hmac = "0.13"
humantime-serde = "1.1"
postgres-protocol = "0.6"
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }
tokio-postgres = "0.7"
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turmoil = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
